/* Logo — same as the web app: Harlow Solid Italic, orange #EE7A2F, golf ball as the "o" */
.fore-logo { display: inline-flex; flex-direction: column; line-height: .9; }
.fore-logo b { font-family: 'Harlow', 'Yellowtail', cursive; font-weight: 400; font-size: 31px; color: #EE7A2F; padding-right: .12em; display: inline-flex; align-items: baseline; white-space: nowrap; }
.fore-logo .fm-ball { width: .42em; height: .42em; flex: none; margin: 0 .03em 0 .02em; transform: translateY(.016em); }
.fore-logo small { font-size: 9px; color: var(--text-2); letter-spacing: .02em; padding-left: 4px; }
/* ═════════════ Tokens — brand colours unchanged ═════════════ */
:root {
    --fore-orange: #FF6E00; --fore-ink: #17120E; --fore-cream: #F5F1E8; --fore-sand: #F2E4CC;
    --fore-fairway: #0E3B2C; --fore-grass: #2B7552; --fore-leaf: #3C9466;
    --ring-1: #FF6E00; --ring-2: #34A26A; --ring-3: #F5B640;
    --red: #FF3B30;
    --font: -apple-system, 'SF Pro Text', 'SF Pro Display', 'Figtree', system-ui, sans-serif;
    --spring: cubic-bezier(0.34, 1.4, 0.5, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ios: cubic-bezier(0.32, 0.72, 0, 1);
}
.device[data-theme='light'] {
    --bg: #F5F1E8; --bg-elev: #FFFFFF; --card: #FFFFFF; --card-2: #FBF8F2;
    --fill: rgba(23,18,14,.06); --fill-2: rgba(23,18,14,.11);
    --text: #17120E; --text-2: rgba(23,18,14,.62); --text-3: rgba(23,18,14,.38);
    --sep: rgba(23,18,14,.1);
    --accent: #FF6E00; --accent-text: #C85400; --accent-soft: rgba(255,110,0,.12);
    --green-soft: rgba(43,117,82,.13); --green-text: #1F6B47;
    --bar: #FFFDF9; --bar-border: rgba(23,18,14,.09); --tab-idle: rgba(23,18,14,.45);
    --shadow: 0 1px 2px rgba(23,18,14,.05), 0 6px 18px rgba(23,18,14,.06);
    --skel: rgba(23,18,14,.07); --skel-hi: rgba(23,18,14,.03);
    --bubble-me: #FF6E00; --bubble-me-text: #17120E; --bubble-them: #FFFFFF;
    --status: #17120E;
}
.device[data-theme='dark'] {
    --bg: #0C0A08; --bg-elev: #1C1814; --card: #1A1612; --card-2: #221D18;
    --fill: rgba(245,241,232,.08); --fill-2: rgba(245,241,232,.15);
    --text: #F5F1E8; --text-2: rgba(245,241,232,.62); --text-3: rgba(245,241,232,.38);
    --sep: rgba(245,241,232,.1);
    --accent: #FF7A14; --accent-text: #FF8F3A; --accent-soft: rgba(255,122,20,.16);
    --green-soft: rgba(60,148,102,.2); --green-text: #5BC28B;
    --bar: #1F1A16; --bar-border: rgba(245,241,232,.1); --tab-idle: rgba(245,241,232,.5);
    --shadow: none;
    --skel: rgba(245,241,232,.08); --skel-hi: rgba(245,241,232,.14);
    --bubble-me: #FF7A14; --bubble-me-text: #17120E; --bubble-them: #221D18;
    --status: #F5F1E8;
}

/* ═════════════ Studio ═════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: var(--font); background: #E9E4D9; color: #17120E; -webkit-font-smoothing: antialiased; }
.studio-head { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 12px 24px; background: rgba(233,228,217,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(23,18,14,.08); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.brand .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--fore-orange); display: grid; place-items: center; font-size: 14px; }
.brand small { font-weight: 500; font-size: 13px; color: rgba(23,18,14,.55); letter-spacing: 0; }
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.ctl-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(23,18,14,.45); margin-right: 6px; }
.seg-studio { display: inline-flex; background: rgba(23,18,14,.07); border-radius: 10px; padding: 3px; }
.seg-studio button { border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: rgba(23,18,14,.7); padding: 6px 11px; border-radius: 8px; cursor: pointer; }
.seg-studio button.on { background: #fff; color: #17120E; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stage { display: grid; grid-template-columns: 420px minmax(320px, 540px); gap: 44px; justify-content: center; align-items: start; padding: 30px 24px; }
@media (max-width: 1040px) { .stage { grid-template-columns: 1fr; justify-items: center; } }

/* ═════════════ Device ═════════════ */
.device { position: sticky; top: 76px; width: 402px; height: 874px; border-radius: 62px; background: #0b0b0b; padding: 11px; box-shadow: 0 0 0 2px #2a2724, 0 40px 80px rgba(23,18,14,.28), 0 10px 24px rgba(23,18,14,.18); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); transition: background .3s, color .3s; clip-path: inset(0 round 52px); isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); transform: translateZ(0); }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 200; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 190; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 42px; font-weight: 600; font-size: 16px; color: var(--status); pointer-events: none; transition: color .3s; }
.statusbar.light { color: #fff; }
.statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text); opacity: .85; z-index: 195; pointer-events: none; }

/* ═════════════ Pages / navigation ═════════════ */
.stack { position: absolute; inset: 0; }
.page { position: absolute; inset: 0; background: var(--bg); transition: background .3s; overflow: hidden; }
.page.push-in { animation: pushIn .46s var(--ios) both; box-shadow: -12px 0 30px rgba(0,0,0,.14); z-index: 2; }
.page.under { animation: underOut .46s var(--ios) both; }
.page.back-in { animation: backIn .4s var(--ios) both; }
.page.pop-out { animation: popOut .38s var(--ios) both; z-index: 3; }
.page.tab-in .content { animation: tabIn .32s var(--ease-out) both; }
@keyframes pushIn { from { transform: translateX(100%); } to { transform: none; } }
@keyframes underOut { to { transform: translateX(-28%); filter: brightness(.94); } }
@keyframes backIn { from { transform: translateX(-28%); filter: brightness(.94); } to { transform: none; filter: none; } }
@keyframes popOut { to { transform: translateX(100%); } }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 100px 0 118px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.scroll.hero { padding-top: 0; }
.scroll.root { padding-top: 54px; }
.apphead { display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 10px 20px; min-height: 56px; }
.apphead .acts { display: flex; gap: 10px; }
.page.is-root::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 15; pointer-events: none; background: linear-gradient(var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent)); }
/* Profile */
.pf-head { text-align: center; padding: 6px 20px 0; }
.pf-av { position: relative; width: 104px; margin: 0 auto; }
.pf-av .cam { position: absolute; right: -2px; bottom: 2px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #17120E; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--bg); }
.pf-av .cam svg { width: 16px; height: 16px; }
.pf-av .ringwrap { position: absolute; inset: -6px; }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); }
.statrow > div { text-align: center; padding: 14px 4px; position: relative; }
.statrow > div + div::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: .5px; background: var(--sep); }
.statrow .n { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.statrow .l { font-size: 12px; color: var(--text-2); font-weight: 600; }
.qtile { padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.qtile .qi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
.qtile .qi svg { width: 19px; height: 19px; }
.meter { height: 8px; border-radius: 4px; background: var(--fill-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ring-2), var(--ring-3)); transform-origin: left; animation: barUp .9s var(--spring) .3s both; }
.scroll.notabs { padding-bottom: 40px; }
.scroll.has-cta { padding-bottom: 190px; }
.scroll.notabs.has-cta { padding-bottom: 120px; }

/* Stagger reveal on load */
.stagger > * { animation: fadeUp .5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }

/* Skeleton loading */
.skel { padding: 0 20px; }
.skel i { display: block; border-radius: 16px; margin-bottom: 14px; background: linear-gradient(90deg, var(--skel) 0%, var(--skel-hi) 40%, var(--skel) 80%); background-size: 300% 100%; animation: shimmer 1.1s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -200% 0; } }

/* Top bar — bell left, chat right (Instagram placement) */
.topbar { position: absolute; top: 0; left: 0; right: 0; height: 100px; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 0 14px 10px; transition: background .25s, border-color .25s; border-bottom: .5px solid transparent; }
.topbar .tb-l { justify-self: start; display: flex; gap: 8px; }
.topbar .tb-r { justify-self: end; display: flex; gap: 8px; }
.topbar .tb-c { font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .25s var(--ease-out); padding-bottom: 9px; white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
.page.scrolled .topbar { background: var(--bg); border-bottom-color: var(--sep); }
.page.scrolled .topbar .tb-c { opacity: 1; transform: none; }
.topbar.on-hero .icon-btn, .topbar.on-hero .back-btn { background: rgba(10,8,6,.38); color: #fff; }
.page.scrolled .topbar.on-hero .icon-btn, .page.scrolled .topbar.on-hero .back-btn { background: var(--fill); color: var(--text); }

.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--text); background: var(--fill); transition: transform .18s var(--spring), background .2s; }
.icon-btn:active { transform: scale(.88); }
.icon-btn svg { width: 21px; height: 21px; }
.back-btn { height: 40px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 1px; padding: 0 14px 0 8px; border-radius: 20px; font: inherit; font-weight: 600; font-size: 15px; color: var(--accent-text); background: transparent; transition: transform .18s var(--spring); max-width: 150px; }
.back-btn span.l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-btn:active { transform: scale(.94); }
.back-btn svg { width: 22px; height: 22px; flex: none; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); animation: badgePop .5s var(--spring) .4s both; }
@keyframes badgePop { from { transform: scale(0); } to { transform: scale(1); } }

/* Large title */
.lt { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px 14px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--text-2); text-transform: uppercase; }
.lt h1, h1.big { margin: 2px 0 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }
.lt-sub { font-size: 15px; color: var(--text-2); margin-top: 4px; }

/* Sections & shelves */
.section { padding: 0 20px; margin-top: 24px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.section-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.more { font-size: 15px; color: var(--accent-text); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.more svg { width: 13px; height: 13px; }
.shelf { display: flex; gap: 12px; overflow-x: auto; padding: 2px 20px 8px; margin: 0 -20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.shelf > * { scroll-snap-align: start; flex: none; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.tiny { font-size: 12px; } .small { font-size: 13px; } .b { font-weight: 700; } .sb { font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { text-align: center; }
.tnum { font-variant-numeric: tabular-nums; }
.hr { height: .5px; background: var(--sep); margin: 12px 0; }

/* Press feedback on everything tappable */
[data-push], [data-sheet], [data-tab], [data-act], .press { transition: transform .22s var(--spring), opacity .2s; cursor: pointer; }
[data-push]:active, [data-sheet]:active, [data-tab]:active, [data-act]:active, .press:active { transform: scale(.97); }

/* Buttons */
.btn { border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px; height: 44px; padding: 0 18px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .2s var(--spring), opacity .2s, background .2s; white-space: nowrap; }
.btn:active { transform: scale(.95); }
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); color: #17120E; }
.btn-primary[disabled] { opacity: .35; pointer-events: none; }
.btn-tinted { background: var(--accent-soft); color: var(--accent-text); }
.btn-gray { background: var(--fill); color: var(--text); }
.btn-dark { background: var(--text); color: var(--bg); }
.btn-white { background: #fff; color: #17120E; }
.btn-ghost-w { background: rgba(255,255,255,.2); color: #fff; }
.btn-red { background: rgba(255,59,48,.12); color: var(--red); }
.btn-block { width: 100%; height: 52px; border-radius: 26px; font-size: 17px; }
.btn-sm { height: 32px; font-size: 13px; padding: 0 12px; border-radius: 16px; }
.btn-sm svg { width: 14px; height: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 0; color: var(--text); font-family: inherit; transition: background .2s, color .2s, transform .2s var(--spring); }
.chip:active { transform: scale(.94); }
.chip.on { background: var(--text); color: var(--bg); }
.chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); }
.chip.outline.on { background: var(--accent-soft); color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip svg { width: 15px; height: 15px; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }
.p-accent { background: var(--accent-soft); color: var(--accent-text); }
.p-green { background: var(--green-soft); color: var(--green-text); }
.p-gray { background: var(--fill); color: var(--text-2); }
.p-red { background: rgba(255,59,48,.13); color: var(--red); }
.p-glass { background: rgba(255,255,255,.22); color: #fff; }

/* Segmented control with sliding thumb */
.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); background: var(--fill); border-radius: 10px; padding: 2px; margin: 0 20px; }
.seg .seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 8px; background: var(--bg-elev); box-shadow: 0 2px 6px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.04); transform: translateX(calc(var(--si) * 100%)); transition: transform .38s var(--spring); }
.seg button { position: relative; z-index: 1; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--text); height: 30px; border-radius: 8px; cursor: pointer; }
.device[data-theme='dark'] .seg .seg-thumb { background: #4A4038; box-shadow: none; }
.pane { display: none; }
.pane.show { display: block; animation: fadeUp .35s var(--ease-out) both; }

.search { margin: 0 20px; height: 40px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text-3); font-size: 16px; }
.search svg { width: 17px; height: 17px; flex: none; }
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); flex: 1; min-width: 0; }

/* Lists */
.list { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.li { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; position: relative; }
.li + .li::before { content: ''; position: absolute; top: 0; right: 0; left: 58px; height: .5px; background: var(--sep); }
.li.ni + .li.ni::before, .li.ni + .li::before { left: 16px; }
.li .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.li .ico svg { width: 17px; height: 17px; }
.li .t { flex: 1; min-width: 0; font-size: 16px; padding: 12px 0; }
.li .t .sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.li .v { color: var(--text-2); font-size: 15px; white-space: nowrap; }
.li .chev { color: var(--text-3); width: 13px; height: 13px; flex: none; }
.li:active[data-push], .li:active[data-sheet], .li:active[data-act] { transform: none; background: var(--fill); }
.list-title { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-2); margin: 0 16px 7px; font-weight: 500; }
.list-foot { font-size: 13px; color: var(--text-2); margin: 7px 16px 0; line-height: 1.4; }

.av { border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }

/* Scene posters */
.scene { position: relative; overflow: hidden; }
.scene svg.art { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 6s ease-out; }
.scene.kb svg.art { animation: kenburns 14s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.1) translate(-2%, 1%); } }
.scene .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 32%, rgba(10,8,6,.74) 100%); }
.scene .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; color: #fff; }

/* Rings + tiles */
.rings-card { display: flex; gap: 18px; align-items: center; }
.rl { margin-bottom: 9px; } .rl:last-child { margin-bottom: 0; }
.rl .k { font-size: 13px; font-weight: 600; }
.rl .val { font-size: 21px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.rl .val small { font-size: 13px; font-weight: 600; opacity: .75; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.tile .k { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.tile .num { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .num small { font-size: 13px; color: var(--text-2); font-weight: 600; }
.arr { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.arr svg { width: 12px; height: 12px; }
.arr.up { background: var(--green-soft); color: var(--green-text); }
.arr.dn { background: var(--accent-soft); color: var(--accent-text); }

/* ═════════════ Tab bar — solid, no glass ═════════════ */
.tabbar { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 66px; z-index: 30; display: flex; padding: 0 6px; border-radius: 33px; background: var(--bar); border: .5px solid var(--bar-border); box-shadow: 0 10px 30px rgba(23,18,14,.16), 0 1px 3px rgba(23,18,14,.08); transform-origin: 50% 100%; transition: transform .5s var(--spring), background .3s, box-shadow .3s; }
.device[data-theme='dark'] .tabbar { box-shadow: 0 10px 30px rgba(0,0,0,.55); }
.tabbar.mini { transform: scale(.8) translateY(14px); }
.tabbar.mini .tb-label { opacity: 0; transform: translateY(-4px); }
.tabbar.mini .tb-ico { transform: translateY(8px) scale(1.12); }
.tabbar.hide { transform: translateY(150%); }
.tb-item { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--tab-idle); transition: color .2s; }
.tb-item .tb-ico { position: relative; width: 50px; height: 30px; display: grid; place-items: center; border-radius: 15px; transition: transform .45s var(--spring); }
.tb-item .tb-ico svg { position: relative; width: 26px; height: 26px; will-change: transform; overflow: visible; }
/* Icons: outline when idle, filled when selected (one SVG; .f fills, .k becomes a cut-out) */
.tb-ico svg { stroke-width: 1.8; }
.tb-ico svg .f { fill: transparent; transition: fill .25s ease; }
.tb-ico svg .k { transition: stroke .25s ease; }
.tb-ico svg .kd { fill: currentColor; transition: fill .25s ease; }
.tb-item.on .tb-ico svg { stroke-width: 2.1; }
.tb-item.on .tb-ico svg .f { fill: currentColor; }
.tb-item.on .tb-ico svg .k { stroke: var(--bubble-solid); }
.tb-item.on .tb-ico svg .kd { fill: var(--bubble-solid); }
/* Instagram-style activity dot instead of counts */
.tdot { position: absolute; top: 0; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bar); animation: badgePop .5s var(--spring) .4s both; }
/* Helium bubble — solid (no glass): inflates, floats with a springy stretch, settles */
.tabbar { --bubble-solid: color-mix(in srgb, var(--accent) 15%, var(--bar)); }
.hbubble { position: absolute; z-index: 0; top: 6px; left: 0; width: 62px; height: 54px; border-radius: 27px; pointer-events: none; will-change: transform;
    background: var(--bubble-solid);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 var(--ly, 1px) var(--lb, 3px) rgba(23,18,14,var(--la, .06)); }
.device[data-theme='dark'] .hbubble { box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 var(--ly, 1px) var(--lb, 3px) rgba(0,0,0,calc(var(--la, .06) * 3)); }
.tb-item { z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
.tabbar { touch-action: none; }
.tb-item .tb-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; transition: opacity .25s, transform .35s var(--ease-out); }
.tb-item.on { color: var(--accent); }
.tb-item.pop .tb-ico svg { animation: iconPop .5s var(--spring); }
@keyframes iconPop { 0% { transform: scale(1); } 35% { transform: scale(.78) translateY(1px); } 100% { transform: scale(1); } }
.tb-item .badge { display: none; }

/* Sticky CTA */
.cta-dock { position: absolute; left: 0; right: 0; bottom: 90px; z-index: 25; padding: 12px 16px; background: linear-gradient(to bottom, transparent, var(--bg) 30%); animation: fadeUp .45s var(--ease-out) .15s both; }
.cta-dock.low { bottom: 0; padding-bottom: 30px; }

/* Sheets & action sheets */
.scrim { position: absolute; inset: 0; z-index: 120; background: rgba(0,0,0,.32); animation: fadeIn .25s both; }
.scrim.out { animation: fadeIn .25s reverse both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 121; max-height: 90%; background: var(--bg); border-radius: 34px 34px 0 0; padding: 8px 0 34px; overflow-y: auto; scrollbar-width: none; animation: sheetUp .5s var(--ios) both; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.sheet.out { animation: sheetDown .3s var(--ios) both; }
.sheet.large { height: 92%; max-height: 92%; }
.sheet .h1blk h1 { font-size: 24px; }
.sheet .h1blk h1.dup { display: none; }
.sheet .h1blk { padding-bottom: 6px !important; }
.sheet .h1blk .eyebrow { margin-bottom: 2px; }
.sheet .sheet-cta { position: sticky; bottom: -34px; padding: 12px 16px 34px; margin-bottom: -34px; background: linear-gradient(to bottom, transparent, var(--bg) 28%); }
.sheet.dragging { animation: none; transition: none; }
.sheet .grabber { cursor: grab; padding: 0; }
.sheet .grab-zone { padding: 0 0 2px; touch-action: none; cursor: grab; }
.sheet .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 8px; }
.sheet-head { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; padding: 6px 16px 12px; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; }
.sheet-head > :last-child { justify-self: end; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetDown { to { transform: translateY(100%); } }
.action-sheet { position: absolute; left: 10px; right: 10px; bottom: 30px; z-index: 121; animation: sheetUp .45s var(--ios) both; }
.action-sheet.out { animation: sheetDown .3s var(--ios) both; }
.as-group { background: var(--bg-elev); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
.as-group .as-t { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--text-2); border-bottom: .5px solid var(--sep); }
.as-group button { display: block; width: 100%; height: 56px; border: 0; background: transparent; font: inherit; font-size: 19px; color: var(--accent-text); cursor: pointer; border-bottom: .5px solid var(--sep); }
.as-group button:last-child { border-bottom: 0; }
.as-group button.red { color: var(--red); }
.as-group button.b { font-weight: 700; }

/* Toast (drops from the island) */
.toast { position: absolute; top: 12px; left: 50%; z-index: 210; transform: translateX(-50%); min-width: 124px; height: 36px; border-radius: 20px; background: #000; color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; font-size: 14px; font-weight: 600; white-space: nowrap; animation: toastIn 2.6s var(--ios) both; }
.toast .tk { width: 22px; height: 22px; border-radius: 50%; background: #34C759; display: grid; place-items: center; }
.toast .tk svg { width: 13px; height: 13px; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .4s ease .35s forwards; }
@keyframes toastIn { 0% { width: 124px; opacity: 0; } 12% { opacity: 1; } 20%, 82% { width: auto; transform: translateX(-50%) translateY(0) scale(1); } 100% { transform: translateX(-50%) scale(.6); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* Date strip & slots */
.dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; }
.dates::-webkit-scrollbar { display: none; }
.date { flex: none; width: 54px; height: 70px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform .25s var(--spring), background .2s; }
.date:active { transform: scale(.92); }
.date .d1 { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; }
.date .d2 { font-size: 21px; font-weight: 700; }
.date.on { background: var(--text); color: var(--bg); }
.date.on .d1 { color: inherit; opacity: .7; }
.date.off { opacity: .35; pointer-events: none; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
.slot { height: 42px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-weight: 600; font-size: 15px; cursor: pointer; font-variant-numeric: tabular-nums; transition: transform .25s var(--spring), background .2s, color .2s; }
.slot:active { transform: scale(.93); }
.slot.on { background: var(--accent); color: #17120E; }
.slot.gone { opacity: .3; text-decoration: line-through; pointer-events: none; }

/* Keypad + PIN + OTP */
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 18px 0 22px; }
.pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-3); transition: background .15s, border-color .15s; }
.pin-dots span.f { background: var(--accent); border-color: var(--accent); animation: dotPop .3s var(--spring); }
.pin-dots.ok span { background: #34C759; border-color: #34C759; }
.pin-dots.shake { animation: shake .45s; }
@keyframes dotPop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px; }
.keypad button { height: 54px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); font: inherit; font-size: 25px; font-weight: 500; color: var(--text); cursor: pointer; transition: transform .15s var(--spring), background .15s; }
.keypad button small { display: block; font-size: 9px; letter-spacing: .2em; font-weight: 700; color: var(--text-2); margin-top: -3px; }
.keypad button:active { transform: scale(.94); background: var(--fill-2); }
.keypad button.ghost { background: transparent; box-shadow: none; font-size: 15px; }
.keypad-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 0 34px; background: var(--fill); }
.otp { display: flex; gap: 8px; justify-content: center; margin: 22px 0; }
.otp span { width: 48px; height: 58px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1.5px transparent; display: grid; place-items: center; font-size: 26px; font-weight: 700; transition: box-shadow .2s; }
.otp span.cur { box-shadow: var(--shadow), inset 0 0 0 2px var(--accent); }
.otp span.f { animation: dotPop .3s var(--spring); }
.otp.ok span { box-shadow: inset 0 0 0 2px #34C759; color: #1F8A3E; }
.phone-field { margin: 26px 20px 0; height: 64px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; padding: 0 18px; font-size: 26px; font-weight: 600; gap: 12px; letter-spacing: .02em; }
.phone-field .cc { color: var(--text-2); padding-right: 12px; border-right: 1px solid var(--sep); }
.caret { display: inline-block; width: 2px; height: 28px; background: var(--accent); animation: blink 1s steps(1) infinite; vertical-align: middle; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.sms-suggest { margin: 0 12px 8px; height: 44px; border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; cursor: pointer; animation: fadeUp .4s var(--ease-out) 1s both; }
.sms-suggest b { letter-spacing: .1em; }

/* Calendar */
.timeline { position: relative; margin: 0 20px; }
.tl-hour { height: 56px; border-top: .5px solid var(--sep); font-size: 11px; color: var(--text-3); padding-top: 2px; font-variant-numeric: tabular-nums; }
.tl-block { position: absolute; left: 44px; right: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; overflow: hidden; animation: fadeUp .45s var(--ease-out) both; }
.tl-lesson { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.tl-avail { background: repeating-linear-gradient(135deg, var(--green-soft) 0 8px, transparent 8px 14px); border-left: 3px solid var(--fore-leaf); color: var(--green-text); }
.tl-block .tb1 { font-weight: 700; }
.now-line { position: absolute; left: 36px; right: 0; height: 2px; background: var(--red); }
.now-line::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); animation: nowPulse 2s infinite; }
@keyframes nowPulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,.5); } 70% { box-shadow: 0 0 0 8px rgba(255,59,48,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); } }

/* Bars */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 10px; }
.bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .bar i { display: block; width: 100%; border-radius: 6px; background: var(--fill-2); transform-origin: bottom; animation: barUp .7s var(--spring) both; animation-delay: calc(var(--i) * 50ms + 150ms); }
.bars .bar.on i { background: var(--accent); }
.bars .bar span { font-size: 11px; color: var(--text-3); font-weight: 600; }
@keyframes barUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.meter i { animation-name: meterIn; }
@keyframes meterIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Toggle */
.tgl { width: 51px; height: 31px; border-radius: 16px; background: #34C759; position: relative; flex: none; cursor: pointer; transition: background .25s; }
.tgl::after { content: ''; position: absolute; top: 2px; left: 22px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .3s var(--spring), width .2s; }
.tgl:active::after { width: 32px; left: 17px; }
.tgl.off { background: var(--fill-2); }
.tgl.off::after { left: 2px; }
.tgl.off:active::after { left: 2px; }

/* Check circles (drills / multi-select) */
.ck { width: 24px; height: 24px; border-radius: 50%; border: 1.8px solid var(--text-3); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; color: #fff; }
.ck svg { width: 13px; height: 13px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s var(--spring); }
.done .ck { background: var(--ring-2); border-color: var(--ring-2); }
.done .ck svg { opacity: 1; transform: scale(1); }
.done .drill-t { text-decoration: line-through; color: var(--text-3); }
.drill-t { transition: color .2s; }

/* Heart */
.heart { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,8,6,.35); color: #fff; cursor: pointer; position: relative; }
.heart svg { width: 18px; height: 18px; transition: transform .3s var(--spring); }
.heart.on { color: #FF4D5E; }
.heart.on svg { animation: heartBeat .45s var(--spring); fill: currentColor; }
.heart.on::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #FF4D5E; animation: burst .5s ease-out both; }
@keyframes heartBeat { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes burst { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

/* Medals */
.medal { width: 84px; text-align: center; }
.medal .m { width: 72px; height: 72px; margin: 0 auto 6px; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; position: relative; overflow: hidden; }
.medal .m::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-100%); animation: shine 3.2s ease-in-out infinite; }
@keyframes shine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.medal .mt { font-size: 12px; font-weight: 600; line-height: 1.2; }
.medal.locked .m { filter: grayscale(1); opacity: .35; }
.medal.locked .m::after { display: none; }

/* Chat */
.chat-scroll { padding: 0 12px 70px; }
.msg-day { text-align: center; font-size: 12px; color: var(--text-3); font-weight: 600; margin: 14px 0 8px; }
.msg { display: flex; margin: 3px 0; }
.msg .bub { max-width: 76%; padding: 9px 13px; border-radius: 20px; font-size: 16px; line-height: 1.32; background: var(--bubble-them); box-shadow: var(--shadow); }
.msg.me { justify-content: flex-end; }
.msg.me .bub { background: var(--bubble-me); color: var(--bubble-me-text); box-shadow: none; }
.msg.new .bub { animation: bubIn .42s var(--spring) both; transform-origin: bottom right; }
.msg.them.new .bub { transform-origin: bottom left; }
@keyframes bubIn { from { transform: scale(.4) translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.msg-meta { text-align: right; font-size: 11px; color: var(--text-3); margin: 2px 6px 6px; }
.sys { margin: 12px 24px; padding: 10px 12px; border-radius: 14px; background: var(--fill); font-size: 12.5px; color: var(--text-2); text-align: center; line-height: 1.4; }
.typing .bub { display: flex; gap: 4px; padding: 13px 14px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: typing 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.composer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; padding: 8px 10px 32px; background: var(--bg); border-top: .5px solid var(--sep); display: flex; align-items: flex-end; gap: 8px; }
.composer .field { flex: 1; min-height: 38px; border-radius: 19px; border: 1px solid var(--sep); background: var(--card); display: flex; align-items: center; padding: 0 6px 0 14px; }
.composer input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text); height: 36px; min-width: 0; }
.composer .send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: #17120E; display: grid; place-items: center; cursor: pointer; transform: scale(0); transition: transform .3s var(--spring); }
.composer .send.show { transform: scale(1); }
.composer .send svg { width: 16px; height: 16px; }
.lesson-chip { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); max-width: 76%; }

/* Voice note */
.voice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--fill); }
.voice .vplay { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #17120E; display: grid; place-items: center; flex: none; cursor: pointer; }
.voice .vplay svg { width: 15px; height: 15px; }
.wave { display: flex; align-items: center; gap: 2px; height: 28px; flex: 1; }
.wave i { flex: 1; border-radius: 2px; background: var(--text-3); }
.voice.playing .wave i { animation: wave 1s ease-in-out infinite; animation-delay: calc(var(--i) * 40ms); background: var(--accent); }
@keyframes wave { 50% { transform: scaleY(.4); } }
.rec-btn { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--fill-2); display: grid; place-items: center; margin: 0 auto; cursor: pointer; }
.rec-btn i { width: 56px; height: 56px; border-radius: 50%; background: var(--red); transition: all .3s var(--spring); }
.rec-btn.on i { width: 28px; height: 28px; border-radius: 8px; }
.rec-btn.on { animation: recPulse 1.4s infinite; }
@keyframes recPulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,.35); } 70% { box-shadow: 0 0 0 16px rgba(255,59,48,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); } }

/* Stepper */
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 10px; }
.stepper button { width: 44px; height: 32px; border: 0; background: transparent; font-size: 20px; color: var(--text); cursor: pointer; }
.stepper b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }

/* Flow overlay (intro / sign-up / onboarding) */
.flow { position: absolute; inset: 0; z-index: 150; background: var(--bg); }
.flow.out { animation: flowOut .5s var(--ios) both; }
@keyframes flowOut { to { opacity: 0; transform: scale(1.04); } }
.fstep { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.fstep.in { animation: pushIn .48s var(--ios) both; }
.fstep.fade { animation: fadeIn .5s both; }
.fstep.leave { animation: underOut .48s var(--ios) both; }
.fhead { position: absolute; top: 54px; left: 0; right: 0; height: 46px; display: flex; align-items: center; padding: 0 12px; gap: 12px; z-index: 3; }
.fprog { flex: 1; height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; margin-right: 44px; }
.fprog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .6s var(--spring); }
.fbody { padding: 112px 24px 140px; }
.fbody h1 { font-size: 32px; letter-spacing: -.025em; line-height: 1.12; margin: 0 0 8px; }
.fbody .lead { font-size: 16px; color: var(--text-2); line-height: 1.45; margin: 0; }
.ffoot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 34px; background: linear-gradient(to bottom, transparent, var(--bg) 26%); z-index: 3; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow), inset 0 0 0 1.5px transparent; margin-bottom: 10px; cursor: pointer; transition: box-shadow .2s, transform .25s var(--spring); }
.opt:active { transform: scale(.98); }
.opt.on { box-shadow: var(--shadow), inset 0 0 0 2px var(--accent); }
.opt .oi { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.opt .oi svg { width: 22px; height: 22px; }
.field { display: block; margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 4px 6px; }
.field .in { height: 52px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; padding: 0 16px; font-size: 17px; gap: 8px; }
.field .in input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--text); flex: 1; min-width: 0; }
.field .in .ph { color: var(--text-3); }
.field textarea { width: 100%; min-height: 110px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); border: 0; padding: 14px 16px; font: inherit; font-size: 16px; color: var(--text); resize: none; outline: 0; }
.upload { height: 120px; border-radius: 18px; border: 2px dashed var(--fill-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-2); font-size: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
.upload.done { border-style: solid; border-color: var(--ring-2); background: var(--green-soft); color: var(--green-text); }
.upload svg { width: 26px; height: 26px; }
.code-box { display: flex; gap: 8px; justify-content: center; }
.code-box span { width: 44px; height: 56px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 26px; font-weight: 800; animation: fadeUp .4s var(--spring) both; animation-delay: calc(var(--i) * 70ms + 200ms); }

/* Splash */
.splash { position: absolute; inset: 0; background: var(--fore-cream); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.splash .dimple { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(23,18,14,.07) 1.2px, transparent 1.8px); background-size: 11px 11px; animation: fadeIn 1s both; }
.splash .logo { position: relative; animation: logoIn 1s var(--ease-out) .2s both; }
.splash .logo .fore-logo b { font-size: 92px; }
.splash .logo .fore-logo small { font-size: 14px; color: rgba(23,18,14,.55); padding-left: 10px; margin-top: 4px; }
.splash .logo em { color: var(--fore-orange); font-style: inherit; }
@keyframes logoIn { from { transform: scale(.8) translateY(14px); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
.splash .green { position: relative; width: 260px; height: 70px; margin-top: 14px; }
.splash .cup { position: absolute; right: 52px; bottom: 16px; width: 24px; height: 8px; border-radius: 50%; background: #17120E; animation: cupPop .5s var(--spring) 2.1s both; }
.splash .pole { position: absolute; right: 63px; bottom: 20px; width: 2px; height: 46px; background: #17120E; animation: fadeIn .4s .5s both; }
.splash .flagp { position: absolute; right: 39px; bottom: 50px; width: 24px; height: 16px; background: var(--fore-orange); clip-path: polygon(0 0, 100% 50%, 0 100%); transform-origin: left center; animation: wave 1.6s ease-in-out infinite, fadeIn .4s .5s both; }
.splash .ball { position: absolute; right: 56px; bottom: 18px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: inset -2px -2px 3px rgba(0,0,0,.2), 0 0 0 1.5px var(--fore-orange); animation: rollIn 1.6s cubic-bezier(.25,.7,.3,1) .6s both; }
.splash .tag { position: relative; margin-top: 26px; font-size: 15px; font-weight: 600; color: rgba(23,18,14,.6); animation: fadeUp .6s var(--ease-out) 1.6s both; }
@keyframes rollIn { 0% { transform: translateX(-230px) rotate(-900deg); } 85% { transform: translateX(0) rotate(0); } 100% { transform: translateY(6px) scale(.5); opacity: 0; } }
@keyframes cupPop { 0% { transform: scale(1); } 50% { transform: scale(1.3, .8); } 100% { transform: scale(1); } }
@keyframes wave { 50% { transform: skewY(-8deg) scaleX(.92); } }
.welcome .wtitle > * { animation: fadeUp .7s var(--ease-out) both; }

/* Success check */
.okcircle { width: 92px; height: 92px; border-radius: 50%; background: var(--green-soft); display: grid; place-items: center; margin: 0 auto; animation: okPop .6s var(--spring) both; }
.okcircle svg { width: 46px; height: 46px; color: var(--green-text); stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s ease .35s forwards; }
@keyframes okPop { from { transform: scale(0); } to { transform: scale(1); } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 2.2s ease-in both; }
@keyframes fall { to { transform: translateY(900px) rotate(720deg); opacity: .6; } }

.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--fill-2); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Map placeholder */
.mapbox { position: relative; height: 100%; background: #E7E2D3; overflow: hidden; }
.device[data-theme='dark'] .mapbox { background: #1d211c; }
.mapbox .road { position: absolute; background: rgba(255,255,255,.7); }
.device[data-theme='dark'] .mapbox .road { background: rgba(255,255,255,.08); }
.mpin { position: absolute; transform: translate(-50%, -100%); background: var(--card); color: var(--text); border-radius: 14px; padding: 5px 9px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.18); animation: pinDrop .6s var(--spring) both; animation-delay: calc(var(--i) * 90ms + 200ms); cursor: pointer; white-space: nowrap; }
.mpin.on { background: var(--accent); color: #17120E; }
.mpin::after { content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: inherit; }
@keyframes pinDrop { from { transform: translate(-50%, -160%); opacity: 0; } to { transform: translate(-50%, -100%); opacity: 1; } }
.me-dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #0A84FF; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(10,132,255,.4); animation: meP 2s infinite; }
@keyframes meP { 70% { box-shadow: 0 0 0 18px rgba(10,132,255,0); } }

/* Notes panel */
.notes .card-n { background: #FFFDF8; border-radius: 22px; padding: 20px 24px; box-shadow: 0 1px 2px rgba(23,18,14,.05), 0 10px 30px rgba(23,18,14,.06); margin-bottom: 16px; }
.notes h2 { font-size: 23px; letter-spacing: -.02em; margin: 8px 0 4px; }
.notes h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: rgba(23,18,14,.5); margin: 16px 0 8px; }
.notes p, .notes li { font-size: 14.5px; line-height: 1.5; color: rgba(23,18,14,.82); }
.notes ul { padding-left: 18px; margin: 0; }
.notes li { margin-bottom: 5px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tags span { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: rgba(23,18,14,.06); }
.tags span.o { background: rgba(255,110,0,.14); color: #A84600; }
.routes { columns: 2; column-gap: 18px; font-size: 13px; }
.routes a { display: block; color: #17120E; text-decoration: none; padding: 3px 0; cursor: pointer; break-inside: avoid; }
.routes a:hover { color: #C85400; }
.routes a code { font-size: 11px; color: rgba(23,18,14,.45); }
.flows-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.flows-btns button { border: 0; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; background: #17120E; color: #fff; cursor: pointer; }
.flows-btns button.alt { background: rgba(23,18,14,.07); color: #17120E; }
.kbd { font-family: ui-monospace, monospace; font-size: 12.5px; background: rgba(23,18,14,.06); padding: 1px 6px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* Installed-app presentation */
.studio-head,.notes{display:none!important}
body{margin:0;background:var(--bg);overflow:hidden}
.stage{display:block;min-height:100dvh;padding:0}
.device{position:relative;top:auto;width:100%;height:100dvh;min-height:100svh;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
.screen{width:100%;height:100%;border-radius:0;clip-path:none;-webkit-mask-image:none;transform:none}
.island,.home-ind{display:none}
.statusbar{display:none}
.scroll.root{padding-top:env(safe-area-inset-top)}
.apphead{padding-top:calc(10px + env(safe-area-inset-top))}
.tabbar{bottom:calc(12px + env(safe-area-inset-bottom))}
#screenMenu{position:absolute;inset:0;z-index:500;display:none;color:var(--text)}
#screenMenu.open{display:block}
#screenMenu .menu-scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(3px)}
#screenMenu .menu-panel{position:absolute;top:0;right:0;bottom:0;width:min(88%,390px);background:var(--bg-elev);box-shadow:-18px 0 48px rgba(0,0,0,.2);padding:calc(22px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));overflow:auto;animation:menuIn .24s var(--ease-out) both}
@keyframes menuIn{from{transform:translateX(24px);opacity:.7}to{transform:none;opacity:1}}
#screenMenu .menu-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
#screenMenu .menu-title{font-size:21px;font-weight:800;letter-spacing:-.03em}
#screenMenu .menu-section{margin:18px 0 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
#screenMenu .menu-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 12px;border:0;border-radius:13px;background:transparent;color:var(--text);font:600 15px var(--font);text-align:left;cursor:pointer}
#screenMenu .menu-row:active{background:var(--fill)}
#screenMenu .menu-row .menu-meta{font-size:11px;color:var(--text-3);font-weight:500}
#screenMenu .menu-pills{display:flex;gap:7px;flex-wrap:wrap}
#screenMenu .menu-pill{border:1px solid var(--sep);border-radius:999px;padding:8px 13px;background:var(--card);color:var(--text);font:600 13px var(--font)}
#screenMenu .menu-pill.on{background:var(--accent);border-color:var(--accent);color:#17120E}
.apphead .menu-trigger{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text);cursor:pointer}
.apphead .menu-trigger svg{width:21px;height:21px}
@media(display-mode:standalone){.screen{padding-bottom:env(safe-area-inset-bottom)}}

    const s = SCN[k], id = 'g' + gid++;
    return `<div class="scene ${kb ? 'kb' : ''}" style="height:${h}px;border-radius:${r}px;${style}">
        <svg class="art" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient></defs>
        <rect width="400" height="225" fill="url(#${id})"/><circle cx="300" cy="70" r="28" fill="${s.sun}" opacity=".9"/>
        <path d="M0 140 Q90 95 190 128 T400 112 V225 H0z" fill="${s.h1}"/><path d="M0 168 Q120 132 240 160 T400 150 V225 H0z" fill="${s.h2}"/>
        <ellipse cx="270" cy="178" rx="58" ry="11" fill="${s.h1}" opacity=".9"/><path d="M0 200 Q140 178 400 196 V225 H0z" fill="${s.fg}"/>
        <path d="M271 178 V128" stroke="#17120E" stroke-width="2"/><path d="M272 129 L296 136 L272 143z" fill="#FF6E00"/><ellipse cx="271" cy="179" rx="5" ry="2" fill="#17120E"/></svg>
        <div class="shade"></div><div class="over">${inner}</div></div>`;
};
function rings(vals, size = 112) {
    const sw = size * .115, gap = 2.5;
    let o = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;transform:rotate(-90deg)">`;
    vals.forEach((v, i) => {
        const r = size / 2 - sw / 2 - i * (sw + gap), c = 2 * Math.PI * r, p = Math.min(v.p, 1);
        o += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${v.c}" stroke-opacity=".18" stroke-width="${sw}"/>`;
        o += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${v.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"><animate attributeName="stroke-dasharray" from="0 ${c}" to="${c * p} ${c}" dur="1.1s" begin="${.15 + i * .12}s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" values="0 ${c};${c * p} ${c}"/></circle>`;
    });
    return o + '</svg>';
}
function spark(pts, w = 150, h = 44, color = 'var(--accent)') {
    const mx = Math.max(...pts), mn = Math.min(...pts);
    const xs = pts.map((_, i) => (i / (pts.length - 1)) * w), ys = pts.map((p) => h - 4 - ((p - mn) / (mx - mn || 1)) * (h - 8));
    const d = xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(' ');
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible"><path d="${d} L${w} ${h} L0 ${h}z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.2s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".3 .7 .2 1" keyTimes="0;1"/></path><circle cx="${xs.at(-1)}" cy="${ys.at(-1)}" r="4.5" fill="${color}"/></svg>`;
}

}

/* Studio */
function menuLabel(key) { return key.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\b\w/g, c => c.toUpperCase()); }\nfunction closeScreenMenu() { const m = $('#screenMenu'); m.classList.remove('open'); m.setAttribute('aria-hidden','true'); }\nfunction openScreenMenu() {\n    const m = $('#screenMenu');\n    const routeKeys = Object.keys(ROUTES);\n    const playerTabs = TABS.player, coachTabs = TABS.coach;\n    const routeItems = routeKeys.map(k => `<button class="menu-row" data-menu-route="${k}"><span>${menuLabel(k)}</span><span class="menu-meta">Open ›</span></button>`).join('');\n    const flowItems = Object.keys(FLOWS).map(k => `<button class="menu-row" data-menu-flow="${k}"><span>${menuLabel(k)} flow</span><span class="menu-meta">Replay ›</span></button>`).join('');\n    m.innerHTML = `<div class="menu-scrim" data-menu-close></div><section class="menu-panel" role="dialog" aria-modal="true" aria-label="Screen navigation"><div class="menu-top"><div class="menu-title">Screen navigator</div><button class="icon-btn" data-menu-close aria-label="Close menu">${I.back}</button></div><div class="menu-section">View as</div><div class="menu-pills">${[['player','Player'],['parent','Parent'],['coach','Coach']].map(([k,l])=>`<button class="menu-pill ${state.role===k?'on':''}" data-menu-role="${k}">${l}</button>`).join('')}</div><div class="menu-section">Appearance</div><div class="menu-pills">${[['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="menu-pill ${$('#device').dataset.theme===k?'on':''}" data-menu-theme="${k}">${l}</button>`).join('')}</div><div class="menu-section">Main screens</div>${(state.role==='coach'?coachTabs:playerTabs).map(([k,l])=>`<button class="menu-row" data-menu-tab="${k}"><span>${l}</span><span class="menu-meta">Main tab ›</span></button>`).join('')}<div class="menu-section">All screens (${routeKeys.length})</div>${routeItems}<div class="menu-section">Onboarding & demo flows</div>${flowItems}</section>`;\n    m.classList.add('open'); m.setAttribute('aria-hidden','false');\n}\n\nfunction setRole(r) {
    state.role = r;
    document.querySelectorAll('#roleSeg button').forEach((x) => x.classList.toggle('on', x.dataset.role === r));
    state.tab = r === 'coach' ? 'today' : 'summary';
    sheetHost.innerHTML = '';
    buildTabbar(); renderRoot();
}
$('#roleSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setRole(b.dataset.role); });
$('#themeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#themeSeg button').forEach((x) => x.classList.toggle('on', x === b)); $('#device').dataset.theme = b.dataset.theme; });
$('#replayIntro').addEventListener('click', () => startFlow('intro'));
$('#notes').addEventListener('click', (e) => {
    const j = e.target.closest('[data-jump]'); if (j) { closeSheet(); if (flow) { flowHost.innerHTML = ''; flow = null; } if (state.stack.length) renderRoot('fade'); setTimeout(() => push(j.dataset.jump), 30); return; }
    const f = e.target.closest('[data-runflow]'); if (f) startFlow(f.dataset.runflow);
});

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));\n\n/* Deep links for review: #role=coach&theme=dark&tab=earnings&push=chat:riya&flow=coach&step=2&nointro */
const q = new URLSearchParams(location.hash.slice(1));
if (q.get('theme')) { $('#device').dataset.theme = q.get('theme'); document.querySelectorAll('#themeSeg button').forEach((x) => x.classList.toggle('on', x.dataset.theme === q.get('theme'))); }
if (q.get('role')) { state.role = q.get('role'); document.querySelectorAll('#roleSeg button').forEach((x) => x.classList.toggle('on', x.dataset.role === state.role)); state.tab = state.role === 'coach' ? 'today' : 'summary'; }
if (q.get('tab')) state.tab = q.get('tab');
buildTabbar();
renderRoot();
if (q.get('push')) setTimeout(() => push(q.get('push')), 50);
if (q.get('sheet')) setTimeout(() => openSheet(q.get('sheet')), 400);
if (q.get('flow')) startFlow(q.get('flow'), +(q.get('step') || 0));
else if (!q.has('nointro') && !window.matchMedia('(display-mode: standalone)').matches) startFlow('intro');
</script>
</body>
