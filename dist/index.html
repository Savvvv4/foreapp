<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fore!">
<meta name="theme-color" content="#0D0F12">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<script>if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('pwa')</script>
<title>Fore! App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Night round: solid orange moments on near-black, or on cool white in light mode. Floating pill nav. Phone stage. */
:root{
  --stage:#0A0B0D;--stage2:#1B1F25;--stage-l:#2F353E;--stage-t:#E6E8EC;--stage-m:#A9AFB8;
  --on-flag:#0D0F12;--flag:#EE7A2F;--on-flag-s:#0D0F12;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;--body:'Inter Tight','Segoe UI',Arial,sans-serif;
  --r:14px;--r2:20px;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.2,.8,.2,1);color-scheme:dark;
}
#phone,#phone[data-mode=dark]{
  --paper:#0D0F12;--card:#171A1F;--sunk:#22262D;--raise:#343A44;--line:#2A2F37;--ink:#F4F5F7;--ink2:#A9AFB8;--ink3:#8D949E;
  --inv:#F4F5F7;--on-inv:#0D0F12;--blk:#343A44;--on-blk:#F4F5F7;--blk-d:#22262D;--on-blk-d:#A9AFB8;
  --flag-d:#F4A06A;--flag-t:#3A2517;--fair:#52C98E;--on-fair:#0D0F12;--fair-t:#14301F;--bad:#F2836F;--on-bad:#0D0F12;--bad-t:#3A1C17;
  --nav:#1C2027;--nav-b:#343A44;--nav-i:#A9AFB8;--shadow:none;color-scheme:dark;
}
#phone[data-mode=light]{
  --paper:#F2F3F5;--card:#FFFFFF;--sunk:#E7E9ED;--raise:#FFFFFF;--line:#E1E4E9;--ink:#0D0F12;--ink2:#555C66;--ink3:#5C636D;
  --inv:#0D0F12;--on-inv:#FFFFFF;--blk:#0D0F12;--on-blk:#FFFFFF;--blk-d:#C9CDD4;--on-blk-d:#0D0F12;
  --flag-d:#A34A14;--flag-t:#FDE9DB;--fair:#1F7A4D;--on-fair:#FFFFFF;--fair-t:#DFF2E7;--bad:#B3361F;--on-bad:#FFFFFF;--bad-t:#F9E3DE;
  --nav:#111317;--nav-b:#111317;--nav-i:#B5B8BE;--shadow:0 1px 2px rgba(13,15,18,.05);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-t);font:15px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{-webkit-appearance:none;border-radius:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-stretch:72%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.94}
.eyebrow{font-size:13px;font-weight:700;color:var(--flag-d)}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:600}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px}
#panel{width:290px;flex:none;color:var(--stage-t);display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto}
#panel img{width:104px;display:block}
#panel p{color:var(--stage-m);font-size:13.500px}
.plabel{font-size:13px;font-weight:600;color:var(--stage-m);margin-bottom:7px}
.rolesw{display:flex;background:var(--stage2);border-radius:12px;padding:3px;position:relative}
.rolesw button{flex:1;min-height:40px;border-radius:9px;text-align:center;font-weight:600;font-size:14px;color:var(--stage-m);position:relative;transition:color .2s}
.rolesw button[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.rolesw .pip{position:absolute;top:7px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--flag);box-shadow:0 0 0 2px var(--stage2)}
.gl{display:flex;flex-direction:column;gap:2px}
.gl button{min-height:40px;padding:8px 10px;border-radius:9px;color:var(--stage-t);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gl button:hover{background:var(--stage2)}
.gl button svg{width:15px;height:15px;color:var(--stage-m);flex:none}
.tog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-height:40px}
#topbar{display:none}

#devwrap{position:relative;flex:none}
#device{position:relative;width:424px;height:896px;padding:11px;border-radius:73px;background:#050506;box-shadow:inset 0 0 0 2.5px #5b5a58,inset 0 0 0 4px #1b1b1d,0 34px 90px rgba(0,0,0,.55);transform-origin:top left}
.hw{position:absolute;width:3px;background:linear-gradient(90deg,#3f3e3c,#6d6b67);z-index:-1}
.hw.l{left:-2.5px;border-radius:2px 0 0 2px}.hw.r{right:-2.5px;border-radius:0 2px 2px 0;transform:scaleX(-1)}
#phone{--sab:34px;--bnt:58px;position:relative;width:402px;height:874px;background:var(--paper);color:var(--ink);border-radius:62px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
#statusbar{flex:none;height:59px;display:flex;align-items:center;justify-content:space-between;padding:12px 32px 0 54px;background:var(--paper);color:var(--ink);font:600 17px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter Tight',sans-serif;transition:background-color .3s ease,color .3s ease;pointer-events:none;font-variant-numeric:tabular-nums}
#phone.moment #statusbar{background:var(--flag);color:var(--on-flag)}
#statusbar .r{display:flex;align-items:center;gap:6px}
#island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000;z-index:40;pointer-events:none}
#island::after{content:'';position:absolute;right:11px;top:12.5px;width:12px;height:12px;border-radius:50%;background:#10131c;box-shadow:inset 0 0 0 2px #171b27}
#homebar{position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:var(--ink);z-index:40;pointer-events:none;transition:background-color .3s}
#phone.moment #homebar{background:var(--on-flag)}
#phone.theming,#phone.theming *{transition:background-color .28s ease,color .28s ease,border-color .28s ease,fill .28s ease,stroke .28s ease!important}
#screens{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);will-change:transform}
.screen.dark{background:var(--flag);color:var(--on-flag)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px;padding:0 16px;margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.bottom-gap{height:26px}
.tabbed .bottom-gap{height:124px}

.hdr{display:flex;align-items:center;gap:6px;padding:4px 12px 12px 18px;min-height:64px;flex:none}
.hdr .logo{height:30px;display:block}
.hdr h1{font-size:46px;flex:1;min-width:0}
.hdr .sp{flex:1}
.nb{display:flex;align-items:center;gap:6px;padding:0 10px 6px;min-height:50px;flex:none}
.nb h1{flex:1;font-size:17px;font-weight:700;text-align:center;letter-spacing:-.01em}
.nb .ghost{width:44px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;transition:transform .12s var(--out),background .15s}
.ib:active{transform:scale(.9);background:var(--sunk)}
.ib svg{width:22px;height:22px}
.ib .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--flag);border:2px solid var(--paper)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink);flex:none}
.av.lg{width:62px;height:62px;border-radius:17px;font-size:20px}
.av.o{background:var(--flag);color:var(--on-flag)}.av.p{background:var(--sunk)}
.avb{width:44px;height:44px;display:grid;place-items:center;flex:none}

#tabbar{position:absolute;left:20px;right:20px;bottom:max(16px,calc(var(--sab) - 6px));height:64px;border-radius:999px;background:var(--nav);box-shadow:0 0 0 1px var(--nav-b),0 10px 26px rgba(0,0,0,.28);display:flex;align-items:center;padding:0 8px;z-index:2;transition:transform .34s var(--ease),opacity .2s}
#tabbar.hide{transform:translateY(160%);opacity:0;pointer-events:none}
.tb{flex:1;height:64px;display:flex;align-items:center;justify-content:center;color:var(--nav-i);position:relative;transition:color .18s,transform .14s var(--out)}
.tb:active{transform:scale(.88)}
.tb svg{width:26px;height:26px}
.tb[aria-current=page]{color:var(--flag)}
.tb .bdg{position:absolute;top:11px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--flag);color:var(--on-flag);font-size:11px;font-weight:700;display:grid;place-items:center}

.card{background:var(--card);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
button.card{display:block;width:100%}
button.card.stack{display:flex}
button.card.stack>span{display:block}
button.card.stack>span.sec-h{display:flex}
.press{transition:transform .14s var(--out)}
.press:active{transform:scale(.975)}
.hero{position:relative;overflow:hidden;background:var(--flag);color:var(--on-flag);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:9px;width:100%}
.hero .eyebrow{color:var(--on-flag);font-size:14px}
.hero .big{font-size:84px;white-space:nowrap}
.hero .sub{font-size:16px;font-weight:600}
.hero-a{display:flex;gap:8px;margin-top:6px}
.hero .btn{background:var(--on-flag);color:#fff}
.hero .btn.night{background:rgba(13,15,18,.14);color:var(--on-flag)}
.t2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t2 .card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;width:100%}
.t2 .val{font-size:46px}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15.500px;background:var(--flag);color:var(--on-flag);transition:transform .14s var(--out),opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.full{width:100%}
.btn.sec2{background:var(--sunk);color:var(--ink)}
.btn.ink{background:var(--inv);color:var(--on-inv)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.grow{flex:1}
.foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px 16px max(22px,var(--sab));display:flex;align-items:center;gap:14px}
.foot .pr{flex:none}.foot .pr b{font-size:19px;display:block;line-height:1.1}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--fair-t);color:var(--fair)}
.pill.fl{background:var(--flag-t);color:var(--flag-d)}
.pill.bad{background:var(--bad-t);color:var(--bad)}
.pill.ink{background:var(--inv);color:var(--on-inv)}
.soon{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;background:var(--flag-t);color:var(--flag-d);font-size:11.500px;font-weight:700;white-space:nowrap}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:1px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{height:44px;padding:0 15px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:14px;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .12s var(--out)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:600;font-size:14px;text-align:center;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(13,15,18,.16)}

.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:13px;padding:0 13px;height:48px;box-shadow:var(--shadow)}
.search svg{width:19px;height:19px;color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.search input::placeholder{color:var(--ink3)}

.cc{display:flex;flex-direction:column;gap:12px;padding:16px}
.cc-top{display:flex;gap:13px;align-items:center;width:100%}
.cc-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cc-n{font-weight:700;font-size:17px;letter-spacing:-.01em}
.cc-r{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:40px;line-height:1;color:var(--flag-d);flex:none}
.mono{width:48px;height:48px;border-radius:14px;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:13.500px;font-weight:600}
.rate svg{width:14px;height:14px;color:var(--flag-d);fill:var(--flag-d)}
.heart.on svg{fill:var(--flag);color:var(--flag)}
.slots{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.slots::-webkit-scrollbar{display:none}
.sl{height:48px;min-width:84px;padding:0 11px;border-radius:11px;border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;transition:transform .12s var(--out),background .15s}
.sl span{color:var(--ink2)}
.sl b{font-size:14px;font-weight:600}
.sl:active{transform:scale(.94);background:var(--flag-t)}
.sl.more{background:var(--sunk);border-color:transparent;font-weight:600;font-size:13px}
.skel{background:linear-gradient(100deg,var(--sunk) 30%,var(--card) 50%,var(--sunk) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite;border-radius:9px}
@keyframes sh{to{background-position:-150% 0}}

.score{display:grid;gap:8px}
.score>div{background:var(--card);border-radius:16px;padding:13px 6px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.score b{display:block;font-family:var(--display);font-stretch:72%;font-size:30px;font-weight:800;line-height:1.05}
.score span{font-size:12px;color:var(--ink2)}
.holes{display:flex;gap:5px}
.holes i{flex:1;height:8px;border-radius:4px;background:var(--sunk);display:block;font-size:0}
.holes i.d{background:var(--flag)}
.holes i.n{background:var(--inv)}

.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 0;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600}
.row .chev{width:18px;height:18px;color:var(--ink3);flex:none}
.tile{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none}
.tile svg{width:21px;height:21px}
.tile.o{background:var(--flag-t);color:var(--flag-d)}
.list{background:var(--card);border-radius:var(--r2);padding:2px 16px;box-shadow:var(--shadow)}
.quote{font-size:22px;line-height:1.22;font-weight:700;letter-spacing:-.015em}
.check{display:flex;align-items:center;gap:11px;min-height:46px;width:100%;font-size:15px}
.box{width:25px;height:25px;border-radius:50%;border:1.8px solid var(--ink3);display:grid;place-items:center;flex:none;color:transparent;transition:background .18s,border-color .18s,transform .22s var(--out)}
.box svg{width:15px;height:15px}
.check.on .box{background:var(--fair);border-color:var(--fair);color:var(--on-fair);transform:scale(1.06)}
.check.on .lbl{color:var(--ink3);text-decoration:line-through}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flag);transition:width .4s var(--out)}

.tiles3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.bt{min-height:104px;border-radius:18px;padding:13px;background:var(--card);display:flex;flex-direction:column;justify-content:space-between;gap:6px;width:100%;box-shadow:var(--shadow)}
.bt svg{width:24px;height:24px}
.bt b{font-size:15px;line-height:1.15;display:block}
.bt.main{background:var(--flag);color:var(--on-flag)}
.bt-top{display:flex;justify-content:space-between;align-items:flex-start}

.datestrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:1px 16px}
.datestrip::-webkit-scrollbar{display:none}
.ds{width:54px;height:66px;border-radius:13px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s;box-shadow:var(--shadow)}
.ds span{font-size:12px;color:var(--ink2)}.ds b{font-family:var(--display);font-stretch:72%;font-size:27px;line-height:1.05}
.ds[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.ds[aria-pressed=true] span{color:var(--on-flag)}
.ds.none{opacity:.42}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm{height:50px;border-radius:12px;background:var(--card);text-align:center;font-weight:600;font-size:14.500px;transition:background .15s,color .15s,transform .12s var(--out);box-shadow:var(--shadow)}
.tm:active{transform:scale(.95)}
.tm[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.tm[disabled]{background:none;box-shadow:none;border:1px dashed var(--line);color:var(--ink3);text-decoration:line-through;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:var(--card);border:1.5px solid transparent;border-radius:15px;transition:border-color .15s;box-shadow:var(--shadow)}
.opt[aria-pressed=true]{border-color:var(--flag)}
.opt .m{flex:1;min-width:0}
.radio{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--ink3);flex:none;display:grid;place-items:center}
.opt[aria-pressed=true] .radio{border-color:var(--flag)}
.opt[aria-pressed=true] .radio::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--flag)}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:700;font-size:17px}
.demo{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:11px;padding:9px 11px;font-size:13px;color:var(--ink2)}
.demo svg{width:16px;height:16px;flex:none}
label.l{font-weight:600;font-size:14px;display:block;margin-bottom:6px}

.tl{position:relative;display:flex;gap:12px;min-height:66px}
.tl .tm2{width:50px;flex:none;text-align:right;font-weight:600;font-size:13.500px;padding-top:12px}
.tl .rail{width:12px;flex:none;position:relative}
.tl .rail::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1.5px;background:var(--line)}
.tl .rail i{position:absolute;left:0;top:15px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink3)}
.tl.now .rail i{background:var(--flag);border-color:var(--flag);box-shadow:0 0 0 4px var(--flag-t)}
.tl.done .rail i{background:var(--ink3)}

 return `<div class="hdr"><img class="logo" src="assets/logo.png" alt="Fore!"><span class="sp"></span>${topActs('AK')}</div><div class="scroll"><div class="pad stack tight">
 ${whoSwitch()}${hero}
 ${mine.length?`<div class="t2">${pack?`<button class="card press" data-a="tab" data-v="lessons"><span class="small muted">Package</span><span class="disp val num">${pack.used+1} / ${pack.total}</span><span class="small muted">Next is lesson ${pack.used+1}</span></button>`:`<button class="card press" data-a="tab" data-v="lessons"><span class="small muted">Lessons</span><span class="disp val num">${past(l=>l.student===who).length}</span><span class="small muted">So far</span></button>`}<button class="card press" data-a="tab" data-v="progress"><span class="small muted">Last score</span><span class="disp val num">${rs.length?rs[rs.length-1][1]:'–'}</span><span class="small muted">${rs.length?'See your trend':'Add a round'}</span></button></div>`:''}
 ${note?`<button class="card press stack" style="gap:7px" data-a="go" data-v="lesson" data-id="${note.id}"><span class="sec-h"><span class="eyebrow">Latest note</span>${note.note.tag?`<span class="pill">${esc(note.note.tag)}</span>`:''}</span><span class="quote">${esc(noteTitle(note.note))}</span><span class="small muted">From Coach ${coach(note.coach).name.split(' ')[0]}, ${ago(note.note.when)}${note.note.voice||note.note.video?` · ${note.note.voice?'Voice':''}${note.note.voice&&note.note.video?' and ':''}${note.note.video?'video':''}`:''}</span></button>`:''}</div>
 <div class="sec"><div class="tiles3"><button class="bt main press" data-a="tab" data-v="book"><span class="bt-top">${ic('users')}</span><b>${mine.length?'Book a lesson':'Find a coach'}</b></button><button class="bt press" data-a="soon" data-id="tee"><span class="bt-top">${ic('flag')}${soon()}</span><b>Tee times</b></button><button class="bt press" data-a="soon" data-id="range"><span class="bt-top">${ic('target')}${soon()}</span><b>Range bays</b></button></div></div><div class="bottom-gap"></div></div>`};

/* ---------- golfer: book ---------- */
function filtered(){const q=S.q.trim().toLowerCase();const r=Object.values(COACHES).filter(c=>c.km<=S.radius&&(S.goal==='all'||c.goals.includes(S.goal))&&(!S.maxP||c.price<=S.maxP)&&(!q||(c.name+c.title+c.good+c.venues.map(v=>v.name+v.area).join(' ')).toLowerCase().includes(q))&&(!S.weekend||slotsOf(c.id,20).some(([d])=>[0,6].includes(dayD(d).getDay())))).map(c=>({c,fit:fitOf(c),sl:slotsOf(c.id,1)}));
 const f=(a,b)=>b.c.badges.includes('Founding Coach')-a.c.badges.includes('Founding Coach');
 return r.sort((a,b)=>S.sort==='near'?a.c.km-b.c.km:S.sort==='rate'?b.c.rate-a.c.rate:S.sort==='price'?a.c.price-b.c.price:(b.fit.n-a.fit.n)||f(a,b)||a.c.km-b.c.km)}
function coachCard({c,fit,sl},i){const nx=sl[0],top=S.prefs&&i===0&&fit.n>=5;return `<article class="card cc press" data-a="go" data-v="coachp" data-id="${c.id}" role="button" tabindex="0" style="cursor:pointer"><div class="cc-top" style="align-items:flex-start">${pic(c,76)}<div class="cc-m"><span class="cc-n" style="font-size:18px">${c.name}</span><span class="small muted">${c.title}</span><span style="display:flex;gap:10px;align-items:center;margin-top:3px">${rateEl(c)}<span class="small muted">${c.km} km</span></span></div><button class="ib cmp ${S.cmpC.has(c.id)?'on':''}" style="margin:-8px 0 0" data-a="cmpC" data-id="${c.id}" aria-label="Compare coach" aria-pressed="${S.cmpC.has(c.id)}">${ic('grid')}</button><button class="ib heart ${S.saved.has(c.id)?'on':''}" style="margin:-8px -8px 0 0" data-a="save" data-id="${c.id}" aria-label="Save coach">${ic('heart')}</button></div>
 ${top?'<div><span class="pill fl">Your best match</span></div>':''}
 ${fit.why.length?`<div class="stack" style="gap:3px">${fit.why.slice(0,2).map(w=>`<div class="small" style="display:flex;gap:6px;align-items:center">${ic('check','width="14" height="14" style="color:var(--fair);flex:none"')}${w}</div>`).join('')}</div>`:`<div class="small"><span class="muted">Good for</span> <b style="font-weight:600">${c.good}</b></div>`}
 <div class="sec-h" style="align-items:center"><span class="small muted">${nx?`Next open ${dLbl(nx[0]).toLowerCase().replace(/^(\w{3}) (\d+) (\w{3})$/,(m,a,b,d)=>a[0].toUpperCase()+a.slice(1)+' '+b+' '+d[0].toUpperCase()+d.slice(1))}`:'No open times'}${c.venues.length>1?` · ${c.venues.length} venues`:''}</span><span class="num"><b>${money(c.pk[0].p)}</b> <span class="small muted">trial</span></span></div></article>`}
function listHTML(){if(!S.loaded)return Array.from({length:3},()=>`<div class="card cc"><div class="cc-top"><div class="skel" style="width:76px;height:76px;border-radius:20px"></div><div class="cc-m" style="gap:8px"><div class="skel" style="height:15px;width:60%"></div><div class="skel" style="height:12px;width:80%"></div></div></div></div>`).join('');
 const r=filtered();if(!r.length)return `<div class="empty">${ic('pin','class="i"')}<b>${S.radius<25?'No coaches this close':'Fore! isn’t here yet'}</b><span class="small muted">${S.radius<25?'Widen your search to see more.':'We’ll tell you when coaches join near you.'}</span>${S.radius<25?'<button class="btn sec2 sm" data-a="wide">Search within 25 km</button>':'<button class="btn sec2 sm" data-a="toast" data-t="We will let you know">Tell me when it opens</button>'}</div>`;
 return `<span class="small muted">${r.length} coach${r.length>1?'es':''} ${S.prefs?'matched to you':'near you'}</span>`+r.map(coachCard).join('')}
function mapHTML(){const r=filtered(),L=S.loc,mk=Math.max(3,...r.map(x=>x.c.km)),sel=r.find(x=>x.c.id===S.mapSel)||r[0];const seen={};
 const pins=r.map(({c})=>{const v=nearest(c).v,n=seen[v.id]=(seen[v.id]||0)+1,X=Math.max(9,Math.min(91,50+(v.x-L.x)/mk*36+(n-1)*15)),Y=Math.max(10,Math.min(86,50-(v.y-L.y)/mk*34+(n-1)*7));return `<button class="pin ${sel&&sel.c.id===c.id?'on':''}" style="left:${X}%;top:${Y}%" data-a="mapS" data-id="${c.id}" aria-label="${c.name}">${pic(c,44,22)}<b class="num">${money(c.pk[0].p)}</b></button>`}).join('');
 return `<div class="mapbox"><svg viewBox="0 0 370 430" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"><rect width="370" height="430" fill="var(--sunk)"/><path d="M-10 300C60 250 110 290 170 240S300 190 390 120" stroke="var(--fair-t)" stroke-width="44" fill="none"/><ellipse cx="72" cy="96" rx="58" ry="40" fill="var(--fair-t)"/><ellipse cx="300" cy="340" rx="52" ry="34" fill="var(--fair-t)"/><g stroke="var(--line)" fill="none" stroke-width="7"><path d="M-10 170H380"/><path d="M130-10V440"/><path d="M-10 390C100 360 240 410 380 340"/><path d="M260-10C240 120 300 260 250 440"/></g><g stroke="var(--line)" fill="none" stroke-width="3"><path d="M-10 70H380M-10 250H380M60-10V440M200-10V440M330-10V440"/></g></svg><span class="you" style="left:50%;top:50%"></span>${pins}</div>${sel?coachCard(sel,1):`<div class="empty"><b>No coaches in this area</b></div>`}`}
V.book=()=>{const who=S.who,mine=myCoaches(who),near=LOCS[S.locI];return `<div class="hdr"><h1 class="disp">Book</h1>${topActs('AK')}</div><div class="scroll"><div class="pad stack">

 <div style="display:flex;gap:7px"><button class="locb press" data-a="locS">${ic('pin')}<span><b>${S.locLabel||near.n.split(',')[0]}</b> within ${S.radius} km</span></button>${S.persona==='parent'?`<button class="chip" data-a="whoT">${who==='kabir'?'Kabir':'Me'}</button>`:''}</div>
 ${mine.map(c=>{const s=smartSlots(c.id,who)[0];return `<div class="card stack"><div class="cc-top">${pic(c,60)}<div class="cc-m"><span class="eyebrow">${who==='kabir'?'Kabir’s coach':'Your coach'}</span><span class="cc-n">${c.name}</span></div><button class="ib" data-a="chatw" data-c="${c.id}" data-s="${who}" aria-label="Message">${ic('msg')}</button></div>${s?`<button class="btn full" data-a="rebook" data-c="${c.id}" data-d="${s.d}" data-t="${s.t}">${dLong(s.d)}, ${fT(s.t)}</button>`:''}<button class="btn sec2 full" data-a="rebook" data-c="${c.id}">See all open times</button></div>`}).join('')}
 ${mine.length?'<div class="sec-h" style="margin-top:12px"><h2>Find another coach</h2></div>':S.prefs?`<button class="demo press" data-a="startMatch" style="width:100%">${ic('check')}<span style="flex:1">Matched to your goals</span><b style="color:var(--flag-d)">Edit</b></button>`:`<button class="hero press" data-a="startMatch" style="gap:5px"><span class="eyebrow">Not sure who to pick?</span><span class="disp" style="font-size:38px">Get matched in 4 taps</span></button>`}
 <div style="display:flex;gap:8px"><label class="search" style="flex:1">${ic('search')}<input id="q" data-i="q" placeholder="Name, skill or venue" value="${esc(S.q)}" aria-label="Search coaches"></label><button class="ib sq" data-a="filters" aria-label="Filters">${ic('filter')}${S.maxP||S.weekend||S.sort!=='best'?'<span class="dot"></span>':''}</button><button class="ib sq" data-a="viewT" aria-label="${S.view==='map'?'Show list':'Show map'}">${ic(S.view==='map'?'list':'pin')}</button></div>
 ${S.prefs?'':`<div class="chips">${GOALS.map(([k,l])=>`<button class="chip" data-a="goal" data-id="${k}" aria-pressed="${S.goal===k}">${l}</button>`).join('')}</div>`}
 <div class="stack" id="coachlist">${S.view==='map'&&S.loaded?mapHTML():listHTML()}</div></div><div class="bottom-gap"></div></div>`};

/* ---------- matching ---------- */
const MQ=[['goal','What do you want to work on?',GOALS.filter(g=>g[0]!=='all')],['level','Where is your game today?',LEVELS],['when','When can you usually play?',WHENS],['style','How do you like to learn?',STYLES]];
V.match=()=>{const i=S.mq,[k,q,o]=MQ[i];return nb(`${i+1} of ${MQ.length}`)+`<div class="scroll"><div class="pad stack" style="gap:18px"><div class="holes">${MQ.map((m,n)=>`<i class="${n<=i?'d':''}"></i>`).join('')}</div><h2 class="disp" style="font-size:50px">${q}</h2><div class="stack" style="gap:8px">${o.map(([v,l])=>`<button class="opt press" data-a="mAns" data-id="${v}" aria-pressed="${S.dp[k]===v}"><span class="m b" style="font-size:17px">${l}</span>${ic('chev','width="18" height="18" style="color:var(--ink3)"')}</button>`).join('')}</div></div><div class="bottom-gap"></div></div>`};

/* ---------- coach profile ---------- */
function availGrid(c){const B=[['Morning',0,720],['Afternoon',720,960],['Evening',960,1500]];return `<div class="avail"><span></span>${Array.from({length:7},(_,i)=>`<b class="tiny">${i?WD[dayD(i).getDay()][0]:'T'}</b>`).join('')}${B.map(([n,a,z])=>`<span class="tiny muted">${n}</span>`+Array.from({length:7},(_,d)=>`<i class="${timesFor(c.id).some(t=>t>=a&&t<z&&isOpen(c.id,d,t))?'on':''}"></i>`).join('')).join('')}</div>`}
V.coachp=p=>{const c=coach(p.id),pv=p.preview,f=fitOf(c),who=S.who,known=rel(who,c.id);
 const slide=(l,r,v)=>`<div><div class="sec-h small"><span>${l}</span><span>${r}</span></div><div class="slide"><i style="left:${v*100}%"></i></div></div>`;
 return `<div class="scroll"><div class="ph">${portrait(c)}<span class="shade"></span><button class="ib rnd" style="left:14px" data-a="back" aria-label="Back">${ic('back')}</button>${pv?'':`<button class="ib rnd heart ${S.saved.has(c.id)?'on':''}" style="right:14px" data-a="save" data-id="${c.id}" aria-label="Save coach">${ic('heart')}</button>`}<div class="phn"><div class="disp">${c.name}</div><div class="b">${c.title} · ${c.yrs} years coaching</div></div></div>
 <div class="pad stack" style="margin-top:14px">${c.badges.length?`<div class="chips wrap">${c.badges.map(b=>`<span class="pill ${b.startsWith('Top')?'ink':'fl'}">${b}</span>`).join('')}</div>`:''}
 <div class="score" style="grid-template-columns:repeat(3,1fr)"><div><b class="num">${c.rate.toFixed(1)}</b><span>${c.rev} reviews</span></div><div><b class="num">${c.lessons}</b><span>lessons taught</span></div><div><b class="num">${c.reply}</b><span>usual reply</span></div></div>
 ${f.why.length?`<div class="card stack" style="gap:7px;background:var(--flag-t)"><span class="b">Why ${c.name.split(' ')[0]} fits you</span>${f.why.map(w=>`<div style="display:flex;gap:7px;align-items:center">${ic('check','width="16" height="16" style="color:var(--flag-d);flex:none"')}<span>${w}</span></div>`).join('')}</div>`:''}
 <div style="display:flex;gap:9px;align-items:flex-start;color:var(--fair)">${ic('shield','width="20" height="20" style="flex:none"')}<span class="small"><b>Verified by Fore!</b> We spoke to ${c.name.split(' ')[0]} and checked this coaching record.</span></div><p>${c.about}</p></div>
 <div class="sec"><div class="photo" role="button" tabindex="0" data-a="soon" data-id="intro" style="height:180px"><img src="assets/swing.jpg" alt="A golfer at the top of the backswing"><span class="soon">Soon</span><span class="ph-lbl">Meet ${c.name.split(' ')[0]}</span></div></div>
 <div class="sec"><div class="sec-h"><h2>How ${c.name.split(' ')[0]} teaches</h2></div><div class="card stack" style="gap:13px">${slide('Keeps it simple','Technical',c.tech)}${slide('Pushes you','Patient',c.pat)}<div class="chips wrap">${c.goals.map(g=>`<span class="pill">${GOALL[g]}</span>`).join('')}</div></div></div>
 <div class="sec"><div class="sec-h"><h2>Usually free</h2><span class="small muted">Next 7 days</span></div><div class="card">${availGrid(c)}</div></div>
 <div class="sec"><div class="sec-h"><h2>Where you'll train</h2></div><div class="stack" style="gap:8px">${c.venues.map(v=>`<div class="card" style="padding:0;overflow:hidden"><div class="vmap">${venueArt(v)}</div><div style="padding:12px 15px" class="sec-h"><span><b style="display:block">${v.name}</b><span class="small muted">${v.area}</span></span><span class="small muted num" style="white-space:nowrap">${Math.hypot(v.x-S.loc.x,v.y-S.loc.y).toFixed(1)} km</span></div></div>`).join('')}<span class="small muted">Exact meeting point is shared once your lesson is confirmed.</span></div></div>
 <div class="sec"><div class="sec-h"><h2>Lessons and prices</h2></div><div class="list">${c.pk.map(k=>`<div class="row"><span class="m"><span class="t" style="display:block">${k.n}</span><span class="small muted">${k.d}</span></span><b class="num">${money(k.p)}</b></div>`).join('')}</div></div>
 <div class="sec"><div class="sec-h"><h2>What students say</h2><span class="rate num">${ic('star')}${c.rate.toFixed(1)}</span></div><div class="card stack" style="gap:8px">${c.sc.map(([n,v])=>`<div style="display:flex;align-items:center;gap:10px"><span class="small" style="width:112px">${n}</span><div class="bar" style="flex:1"><i style="width:${(v/5)*100}%"></i></div><span class="small b num">${v.toFixed(1)}</span></div>`).join('')}</div><div class="revs">${REVIEWS.map(([n,r,t,w])=>`<div class="card rev"><div class="sec-h"><b>${n}</b><span class="rate num">${ic('star')}${r}</span></div><p class="small">${t}</p><span class="tiny muted">${w} · Verified lesson</span></div>`).join('')}</div></div>
 <div class="sec"><div class="sec-h"><h2>Qualifications</h2></div><div class="stack" style="gap:7px">${c.quals.map(q=>`<div style="display:flex;gap:8px;align-items:center">${ic('check','width="17" height="17" style="color:var(--fair);flex:none"')}<span>${q}</span></div>`).join('')}</div></div>
 ${childSafe(c)}<div class="sec"><div class="sec-h"><h2>How booking works</h2></div><div class="list"><div class="row"><span class="tile">${ic('send')}</span><span class="m small"><b>Send a request.</b> Pick times and say hello.</span></div><div class="row"><span class="tile">${ic('check')}</span><span class="m small"><b>${c.name.split(' ')[0]} confirms.</b> Usually within ${c.reply}.</span></div><div class="row"><span class="tile">${ic('card')}</span><span class="m small"><b>Pay only then.</b> Free cancellation up to 24 hours before.</span></div></div></div><div class="bottom-gap"></div></div>
 ${pv?`<div class="foot"><span class="small muted" style="flex:1">This is how golfers see your profile.</span><button class="btn sm" data-a="back">Done</button></div>`:`<div class="foot"><button class="ib sq" data-a="chatw" data-c="${c.id}" data-s="${who}" aria-label="Ask a question">${ic('msg')}</button><span class="pr"><span class="tiny muted">${known?'From your coach':'Trial from'}</span><b class="num">${money(c.pk[0].p)}</b></span><button class="btn grow" data-a="book" data-c="${c.id}">${known?'See open times':'Request a lesson'}</button></div>`}`};
function venueArt(v){const r=rngLite(v.id),a=r(40,160),b=r(30,80);return `<svg viewBox="0 0 370 96" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"><rect width="370" height="96" fill="var(--sunk)"/><ellipse cx="${a+90}" cy="${b}" rx="110" ry="46" fill="var(--fair-t)"/><path d="M-5 74H375M${a} -5V100" stroke="var(--line)" stroke-width="6"/><circle cx="${a+90}" cy="${b-4}" r="9" fill="var(--flag)"/><circle cx="${a+90}" cy="${b-4}" r="3.500" fill="var(--on-flag)"/></svg>`}

/* ---------- shared date and time picking ---------- */
function monthCal(c,v,picked){const b=S.bk,dow=(dayD(0).getDay()+6)%7,cells=[];for(let i=0;i<35;i++){const d=i-dow,x=dayD(d),op=d>=0&&d<28&&timesFor(c).some(t=>openAt(c,d,t,v)),sel=b.d===d,ch=picked&&picked.some(p=>p.d===d);cells.push(op?`<button class="dc on ${sel?'sel':''} ${ch?'ch':''}" data-a="bkday" data-id="${d}" aria-pressed="${sel}" aria-label="${dLong(d)}"><span class="num">${x.getDate()}</span><i></i></button>`:`<span class="dc off num">${x.getDate()}</span>`)}const m=dayD(Math.max(b.d,0));return `<div class="card" style="padding:12px 10px 8px"><div class="b" style="padding:0 6px 8px">${MO[m.getMonth()]} ${m.getFullYear()}</div><div class="mcal">${['M','T','W','T','F','S','S'].map(x=>`<b class="tiny muted">${x}</b>`).join('')}${cells.join('')}</div></div>`}
function timeGroups(c,v,isOn,act){const ts=timesFor(c).filter(t=>openAt(c,S.bk.d,t,v));if(!ts.length)return `<div class="card muted">No open times this day. Try a day with a dot.</div>`;const G=[['Morning',0,720],['Afternoon',720,960],['Evening',960,1500]];return G.map(([n,a,z])=>{const g=ts.filter(t=>t>=a&&t<z);return g.length?`<div><div class="small muted" style="margin-bottom:6px">${n}</div><div class="times">${g.map(t=>`<button class="tm num" data-a="${act}" data-id="${t}" aria-pressed="${isOn(t)}">${fT(t)}</button>`).join('')}</div></div>`:''}).join('')}
const venueSeg=c=>coach(c).venues.length>1?`<div><label class="l">Where</label><div class="seg">${coach(c).venues.map(v=>`<button data-a="bkv" data-id="${v.id}" aria-pressed="${S.bk.v===v.id}">${v.name.split(' ')[0]}</button>`).join('')}</div></div>`:'';

/* ---------- booking with a coach you already know ---------- */

seed();applyTheme();show('tab');chrome();sizeDevice();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fit(document));try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(THEME==='auto')applyTheme(true)})}catch(e){}
/* ---------- hosted build only: remember who is logged in, pick up new versions ---------- */
(function(){
const KEY='fore.session',FLAG='fore.updated',TRY='fore.tried';
const get=(s,k)=>{try{return s.getItem(k)}catch(e){return null}},set=(s,k,v)=>{try{v==null?s.removeItem(k):s.setItem(k,v)}catch(e){}};
const _land=land;land=function(r,p,msg){_land(r,p,msg);set(localStorage,KEY,JSON.stringify({r,p:S.persona}))};
const _out=ACT.logoutGo;ACT.logoutGo=(d,e,v)=>{set(localStorage,KEY,null);_out(d,e,v)};
let saved=null;try{saved=JSON.parse(get(localStorage,KEY))}catch(e){}
if(saved&&saved.r){_land(saved.r,saved.p||null)}
if(get(localStorage,FLAG)){set(localStorage,FLAG,null);toast('Updated to the latest version')}
let busy=false;
async function check(){if(busy||document.visibilityState!=='visible')return;busy=true;try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(r.ok){const v=(await r.text()).trim();if(v&&v!==window.__BUILD&&get(sessionStorage,TRY)!==v){set(sessionStorage,TRY,v);set(localStorage,FLAG,'1');location.reload()}}}catch(e){}busy=false}
document.addEventListener('visibilitychange',check);addEventListener('pageshow',check);addEventListener('focus',check);
})();
</script></body></html>
