<title>Fore! App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Night round: solid orange moments on near-black, or on cool white in light mode. Floating pill nav. Phone stage. */
:root{
  --stage:#0A0B0D;--stage2:#1B1F25;--stage-l:#2F353E;--stage-t:#E6E8EC;--stage-m:#A9AFB8;
  --on-flag:#0D0F12;--flag:#EE7A2F;--on-flag-s:#0D0F12;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;--body:'Inter Tight','Segoe UI',Arial,sans-serif;
  --r:14px;--r2:20px;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.2,.8,.2,1);color-scheme:dark;
}
#phone,#phone[data-mode=dark]{
  --paper:#0D0F12;--card:#171A1F;--sunk:#22262D;--raise:#343A44;--line:#2A2F37;--ink:#F4F5F7;--ink2:#A9AFB8;--ink3:#8D949E;
  --inv:#F4F5F7;--on-inv:#0D0F12;--blk:#343A44;--on-blk:#F4F5F7;--blk-d:#22262D;--on-blk-d:#A9AFB8;
  --flag-d:#F4A06A;--flag-t:#3A2517;--fair:#52C98E;--on-fair:#0D0F12;--fair-t:#14301F;--bad:#F2836F;--on-bad:#0D0F12;--bad-t:#3A1C17;
  --nav:#1C2027;--nav-b:#343A44;--nav-i:#A9AFB8;--shadow:none;color-scheme:dark;
}
#phone[data-mode=light]{
  --paper:#F2F3F5;--card:#FFFFFF;--sunk:#E7E9ED;--raise:#FFFFFF;--line:#E1E4E9;--ink:#0D0F12;--ink2:#555C66;--ink3:#5C636D;
  --inv:#0D0F12;--on-inv:#FFFFFF;--blk:#0D0F12;--on-blk:#FFFFFF;--blk-d:#C9CDD4;--on-blk-d:#0D0F12;
  --flag-d:#A34A14;--flag-t:#FDE9DB;--fair:#1F7A4D;--on-fair:#FFFFFF;--fair-t:#DFF2E7;--bad:#B3361F;--on-bad:#FFFFFF;--bad-t:#F9E3DE;
  --nav:#111317;--nav-b:#111317;--nav-i:#B5B8BE;--shadow:0 1px 2px rgba(13,15,18,.05);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-t);font:15px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{-webkit-appearance:none;border-radius:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-stretch:72%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.94}
.eyebrow{font-size:13px;font-weight:700;color:var(--flag-d)}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:600}

#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px}
#panel{width:290px;flex:none;color:var(--stage-t);display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto}
#panel img{width:104px;display:block}
#panel p{color:var(--stage-m);font-size:13.500px}
.plabel{font-size:13px;font-weight:600;color:var(--stage-m);margin-bottom:7px}
.rolesw{display:flex;background:var(--stage2);border-radius:12px;padding:3px;position:relative}
.rolesw button{flex:1;min-height:40px;border-radius:9px;text-align:center;font-weight:600;font-size:14px;color:var(--stage-m);position:relative;transition:color .2s}
.rolesw button[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.rolesw .pip{position:absolute;top:7px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--flag);box-shadow:0 0 0 2px var(--stage2)}
.gl{display:flex;flex-direction:column;gap:2px}
.gl button{min-height:40px;padding:8px 10px;border-radius:9px;color:var(--stage-t);font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gl button:hover{background:var(--stage2)}
.gl button svg{width:15px;height:15px;color:var(--stage-m);flex:none}
.tog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-height:40px}
#topbar{display:none}

#devwrap{position:relative;flex:none}
#device{position:relative;width:424px;height:896px;padding:11px;border-radius:73px;background:#050506;box-shadow:inset 0 0 0 2.5px #5b5a58,inset 0 0 0 4px #1b1b1d,0 34px 90px rgba(0,0,0,.55);transform-origin:top left}
.hw{position:absolute;width:3px;background:linear-gradient(90deg,#3f3e3c,#6d6b67);z-index:-1}
.hw.l{left:-2.5px;border-radius:2px 0 0 2px}.hw.r{right:-2.5px;border-radius:0 2px 2px 0;transform:scaleX(-1)}
#phone{--sab:34px;--bnt:58px;position:relative;width:402px;height:874px;background:var(--paper);color:var(--ink);border-radius:62px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
#statusbar{flex:none;height:59px;display:flex;align-items:center;justify-content:space-between;padding:12px 32px 0 54px;background:var(--paper);color:var(--ink);font:600 17px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter Tight',sans-serif;transition:background-color .3s ease,color .3s ease;pointer-events:none;font-variant-numeric:tabular-nums}
#phone.moment #statusbar{background:var(--flag);color:var(--on-flag)}
#statusbar .r{display:flex;align-items:center;gap:6px}
#island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000;z-index:40;pointer-events:none}
#island::after{content:'';position:absolute;right:11px;top:12.5px;width:12px;height:12px;border-radius:50%;background:#10131c;box-shadow:inset 0 0 0 2px #171b27}
#homebar{position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:var(--ink);z-index:40;pointer-events:none;transition:background-color .3s}
#phone.moment #homebar{background:var(--on-flag)}
#phone.theming,#phone.theming *{transition:background-color .28s ease,color .28s ease,border-color .28s ease,fill .28s ease,stroke .28s ease!important}
#screens{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);will-change:transform}
.screen.dark{background:var(--flag);color:var(--on-flag)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px;padding:0 16px;margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.bottom-gap{height:26px}
.tabbed .bottom-gap{height:124px}

.hdr{display:flex;align-items:center;gap:6px;padding:4px 12px 12px 18px;min-height:64px;flex:none}
.hdr .logo{height:30px;display:block}
.hdr h1{font-size:46px;flex:1;min-width:0}
.hdr .sp{flex:1}
.nb{display:flex;align-items:center;gap:6px;padding:0 10px 6px;min-height:50px;flex:none}
.nb h1{flex:1;font-size:17px;font-weight:700;text-align:center;letter-spacing:-.01em}
.nb .ghost{width:44px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;transition:transform .12s var(--out),background .15s}
.ib:active{transform:scale(.9);background:var(--sunk)}
.ib svg{width:22px;height:22px}
.ib .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--flag);border:2px solid var(--paper)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink);flex:none}
.av.lg{width:62px;height:62px;border-radius:17px;font-size:20px}
.av.o{background:var(--flag);color:var(--on-flag)}.av.p{background:var(--sunk)}
.avb{width:44px;height:44px;display:grid;place-items:center;flex:none}

#tabbar{position:absolute;left:20px;right:20px;bottom:max(16px,calc(var(--sab) - 6px));height:64px;border-radius:999px;background:var(--nav);box-shadow:0 0 0 1px var(--nav-b),0 10px 26px rgba(0,0,0,.28);display:flex;align-items:center;padding:0 8px;z-index:2;transition:transform .34s var(--ease),opacity .2s}
#tabbar.hide{transform:translateY(160%);opacity:0;pointer-events:none}
.tb{flex:1;height:64px;display:flex;align-items:center;justify-content:center;color:var(--nav-i);position:relative;transition:color .18s,transform .14s var(--out)}
.tb:active{transform:scale(.88)}
.tb svg{width:26px;height:26px}
.tb[aria-current=page]{color:var(--flag)}
.tb .bdg{position:absolute;top:11px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--flag);color:var(--on-flag);font-size:11px;font-weight:700;display:grid;place-items:center}

.card{background:var(--card);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
button.card{display:block;width:100%}
button.card.stack{display:flex}
button.card.stack>span{display:block}
button.card.stack>span.sec-h{display:flex}
.press{transition:transform .14s var(--out)}
.press:active{transform:scale(.975)}
.hero{position:relative;overflow:hidden;background:var(--flag);color:var(--on-flag);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:9px;width:100%}
.hero .eyebrow{color:var(--on-flag);font-size:14px}
.hero .big{font-size:84px;white-space:nowrap}
.hero .sub{font-size:16px;font-weight:600}
.hero-a{display:flex;gap:8px;margin-top:6px}
.hero .btn{background:var(--on-flag);color:#fff}
.hero .btn.night{background:rgba(13,15,18,.14);color:var(--on-flag)}
.t2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t2 .card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;width:100%}
.t2 .val{font-size:46px}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15.500px;background:var(--flag);color:var(--on-flag);transition:transform .14s var(--out),opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.full{width:100%}
.btn.sec2{background:var(--sunk);color:var(--ink)}
.btn.ink{background:var(--inv);color:var(--on-inv)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.grow{flex:1}
.foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px 16px max(22px,var(--sab));display:flex;align-items:center;gap:14px}
.foot .pr{flex:none}.foot .pr b{font-size:19px;display:block;line-height:1.1}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--fair-t);color:var(--fair)}
.pill.fl{background:var(--flag-t);color:var(--flag-d)}
.pill.bad{background:var(--bad-t);color:var(--bad)}
.pill.ink{background:var(--inv);color:var(--on-inv)}
.soon{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;background:var(--flag-t);color:var(--flag-d);font-size:11.500px;font-weight:700;white-space:nowrap}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:1px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{height:44px;padding:0 15px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:14px;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .12s var(--out)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:600;font-size:14px;text-align:center;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(13,15,18,.16)}

.search{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:13px;padding:0 13px;height:48px;box-shadow:var(--shadow)}
.search svg{width:19px;height:19px;color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.search input::placeholder{color:var(--ink3)}

.cc{display:flex;flex-direction:column;gap:12px;padding:16px}
.cc-top{display:flex;gap:13px;align-items:center;width:100%}
.cc-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cc-n{font-weight:700;font-size:17px;letter-spacing:-.01em}
.cc-r{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:40px;line-height:1;color:var(--flag-d);flex:none}
.mono{width:48px;height:48px;border-radius:14px;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:13.500px;font-weight:600}
.rate svg{width:14px;height:14px;color:var(--flag-d);fill:var(--flag-d)}
.heart.on svg{fill:var(--flag);color:var(--flag)}
.slots{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.slots::-webkit-scrollbar{display:none}
.sl{height:48px;min-width:84px;padding:0 11px;border-radius:11px;border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;transition:transform .12s var(--out),background .15s}
.sl span{color:var(--ink2)}
.sl b{font-size:14px;font-weight:600}
.sl:active{transform:scale(.94);background:var(--flag-t)}
.sl.more{background:var(--sunk);border-color:transparent;font-weight:600;font-size:13px}
.skel{background:linear-gradient(100deg,var(--sunk) 30%,var(--card) 50%,var(--sunk) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite;border-radius:9px}
@keyframes sh{to{background-position:-150% 0}}

.score{display:grid;gap:8px}
.score>div{background:var(--card);border-radius:16px;padding:13px 6px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.score b{display:block;font-family:var(--display);font-stretch:72%;font-size:30px;font-weight:800;line-height:1.05}
.score span{font-size:12px;color:var(--ink2)}
.holes{display:flex;gap:5px}
.holes i{flex:1;height:8px;border-radius:4px;background:var(--sunk);display:block;font-size:0}
.holes i.d{background:var(--flag)}
.holes i.n{background:var(--inv)}

.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 0;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600}
.row .chev{width:18px;height:18px;color:var(--ink3);flex:none}
.tile{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none}
.tile svg{width:21px;height:21px}
.tile.o{background:var(--flag-t);color:var(--flag-d)}
.list{background:var(--card);border-radius:var(--r2);padding:2px 16px;box-shadow:var(--shadow)}
.quote{font-size:22px;line-height:1.22;font-weight:700;letter-spacing:-.015em}
.check{display:flex;align-items:center;gap:11px;min-height:46px;width:100%;font-size:15px}
.box{width:25px;height:25px;border-radius:50%;border:1.8px solid var(--ink3);display:grid;place-items:center;flex:none;color:transparent;transition:background .18s,border-color .18s,transform .22s var(--out)}
.box svg{width:15px;height:15px}
.check.on .box{background:var(--fair);border-color:var(--fair);color:var(--on-fair);transform:scale(1.06)}
.check.on .lbl{color:var(--ink3);text-decoration:line-through}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flag);transition:width .4s var(--out)}

.tiles3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.bt{min-height:104px;border-radius:18px;padding:13px;background:var(--card);display:flex;flex-direction:column;justify-content:space-between;gap:6px;width:100%;box-shadow:var(--shadow)}
.bt svg{width:24px;height:24px}
.bt b{font-size:15px;line-height:1.15;display:block}
.bt.main{background:var(--flag);color:var(--on-flag)}
.bt-top{display:flex;justify-content:space-between;align-items:flex-start}

.datestrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:1px 16px}
.datestrip::-webkit-scrollbar{display:none}
.ds{width:54px;height:66px;border-radius:13px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s;box-shadow:var(--shadow)}
.ds span{font-size:12px;color:var(--ink2)}.ds b{font-family:var(--display);font-stretch:72%;font-size:27px;line-height:1.05}
.ds[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.ds[aria-pressed=true] span{color:var(--on-flag)}
.ds.none{opacity:.42}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm{height:50px;border-radius:12px;background:var(--card);text-align:center;font-weight:600;font-size:14.500px;transition:background .15s,color .15s,transform .12s var(--out);box-shadow:var(--shadow)}
.tm:active{transform:scale(.95)}
.tm[aria-pressed=true]{background:var(--flag);color:var(--on-flag)}
.tm[disabled]{background:none;box-shadow:none;border:1px dashed var(--line);color:var(--ink3);text-decoration:line-through;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:var(--card);border:1.5px solid transparent;border-radius:15px;transition:border-color .15s;box-shadow:var(--shadow)}
.opt[aria-pressed=true]{border-color:var(--flag)}
.opt .m{flex:1;min-width:0}
.radio{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--ink3);flex:none;display:grid;place-items:center}
.opt[aria-pressed=true] .radio{border-color:var(--flag)}
.opt[aria-pressed=true] .radio::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--flag)}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:700;font-size:17px}
.demo{display:flex;gap:8px;align-items:center;background:var(--sunk);border-radius:11px;padding:9px 11px;font-size:13px;color:var(--ink2)}
.demo svg{width:16px;height:16px;flex:none}
label.l{font-weight:600;font-size:14px;display:block;margin-bottom:6px}

.tl{position:relative;display:flex;gap:12px;min-height:66px}
.tl .tm2{width:50px;flex:none;text-align:right;font-weight:600;font-size:13.500px;padding-top:12px}
.tl .rail{width:12px;flex:none;position:relative}
.tl .rail::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1.5px;background:var(--line)}
.tl .rail i{position:absolute;left:0;top:15px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink3)}
.tl.now .rail i{background:var(--flag);border-color:var(--flag);box-shadow:0 0 0 4px var(--flag-t)}
.tl.done .rail i{background:var(--ink3)}
.tl .bx{flex:1;min-width:0;background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;box-shadow:var(--shadow)}
.tl .bx.open{background:none;box-shadow:none;border:1px dashed var(--ink3)}
.tl.done .bx{opacity:.62}
.wkgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.wkgrid i{aspect-ratio:1;border-radius:6px;background:var(--flag)}
.wkgrid i.o{background:none;border:1.5px dashed var(--ink3)}

.calh{display:grid;grid-template-columns:34px repeat(7,1fr);padding:0 10px 4px 6px;flex:none}
.calh div{text-align:center;font-size:11.500px;color:var(--ink2);line-height:1.2}

.enter-l{animation:enl .32s var(--ease) both}.exit-r{animation:exr .32s var(--ease) both;z-index:3}

@keyframes er{from{transform:translateX(100%)}}@keyframes el{to{transform:translateX(-26%);opacity:.6}}
@keyframes enl{from{transform:translateX(-26%);opacity:.6}}@keyframes exr{to{transform:translateX(100%)}}
@keyframes ef{from{opacity:0;transform:translateY(5px)}}@keyframes eu{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
@keyframes sheetin{from{transform:translateY(100%)}}@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rip{from{transform:scale(.3);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bnin{from{transform:translateY(-130%)}}@keyframes bnout{to{transform:translateY(-130%);opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
